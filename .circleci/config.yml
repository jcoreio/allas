# created by @jcoreio/toolchain-circle

version: 2.1

jobs:
  build-amd64:
    docker:
      - image: cimg/node:24.8.0

    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Setup NPM Token
          command: |
            npm config set \
              "//registry.npmjs.org/:_authToken=$NPM_TOKEN" \
              "registry=https://registry.npmjs.org/"
      - run:
          name: Corepack enable
          command: sudo corepack enable
      - run:
          name: Install Dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Prepublish
          command: |
            [[ $(netstat -tnlp | grep -F 'circleci-agent') ]] || pnpm run tc prepublish

  build-arm64:
    docker:
      - image: cimg/node:24.8.0
    resource_class: arm.medium

    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Setup NPM Token
          command: |
            npm config set \
              "//registry.npmjs.org/:_authToken=$NPM_TOKEN" \
              "registry=https://registry.npmjs.org/"
      - run:
          name: Corepack enable
          command: sudo corepack enable
      - run:
          name: Install Dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Prepublish
          command: |
            [[ $(netstat -tnlp | grep -F 'circleci-agent') ]] || pnpm run tc prepublish

  release:
    docker:
      - image: cimg/node:24.8.0

    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Setup NPM Token
          command: |
            npm config set \
              "//registry.npmjs.org/:_authToken=$NPM_TOKEN" \
              "registry=https://registry.npmjs.org/"
      - run:
          name: Corepack enable
          command: sudo corepack enable
      - run:
          name: Install Dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Release
          command: |
            [[ $(netstat -tnlp | grep -F 'circleci-agent') ]] || pnpm run tc release

workflows:
  build:
    jobs:
      - build-amd64:
          context:
            - npm-release
            - github-release
            - aws-deployments
      - build-arm64:
          context:
            - npm-release
            - github-release
            - aws-deployments
      - release:
          context:
            - npm-release
            - github-release
            - aws-deployments
          depends_on:
            - build-amd64
            - build-arm64
